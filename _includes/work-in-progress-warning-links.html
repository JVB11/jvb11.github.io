<!-- CREATE CSS STYLE -->
<style>
  .custom-alert-box {
    display: flex;
    align-items: flex-start;
    border-radius: 6px;
    padding: 10px 14px;
    margin-top: 1.2rem;
    margin-bottom: 1.2rem;
    margin-left: 0.75rem;
  }

  .custom-alert-icon {
    font-size: 0.95rem;
    margin-top: 3px;
    margin-right: 15px;
    flex-shrink: 0;
  }

  .custom-alert-text {
    color: #c9d1d9;
    font-size: 0.8rem;
    line-height: 1.4;
  }

  .custom-alert-title {
    display: inline-block;
    margin-right: 4px;
  }
  /* WARNING: ORANGE */
  .alert-warning {
    background-color: rgba(240,136, 62, 0.06);
    border-left: 3px solid #f0883e;
  }
  .alert-warning .custom-alert-icon
  .alert-warning .custom-alert-title { color: #f0883e; }
  /* INFO: BLUE */
  .alert-info {
    background-color: rgba(82, 173, 200, 0.06);
    border-left: 3px solid #327286;
  }
  .alert-info .custom-alert-icon
  .alert-info .custom-alert-title { color: 327286; }
</style>

<!-- CREATE HTML STRUCTURE -->
{% if include.type == "warning" %}

  <div class="custom-alert-box alert-warning">
    <i class="fas fa-exclamation-triangle custom-alert-icon"></i>
    <div class="custom-alert-text">
      <strong class="custom-alert-title">Work in Progress</strong>
      {{ include.text }}
    </div>
  </div>

{% else %}

  <div class="custom-alert-box alert-info">
    <i class="fas fa-info-circle custom-alert-icon"></i>
    <div class="custom-alert-text">
      <strong class="custom-alert-title">Info</strong>
      {{ include.text }}
    </div>
  </div>

{% endif %}
